<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a8fd0"/>
      <stop offset=".55" stop-color="#1f5f8b"/>
      <stop offset="1" stop-color="#123a57"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".18" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e9f7"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#f27a1a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#08243a" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- vòng trang trí mờ -->
  <circle cx="420" cy="440" r="170" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="34"/>
  <g filter="url(#sh)">
    <polyline points="128,180 182,340 256,214 330,340 384,180" fill="none" stroke="url(#w)"
      stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="398" cy="118" r="30" fill="url(#dot)" filter="url(#sh)"/>
</svg>
