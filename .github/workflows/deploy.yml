# Tự động build và deploy lên GitHub Pages mỗi khi đẩy code lên nhánh main.
# Bật một lần: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Đặt trong Settings → Secrets and variables → Actions → tab Variables
          VITE_CONTACT_URL: ${{ vars.CONTACT_URL }}
          VITE_CONTACT_LABEL: ${{ vars.CONTACT_LABEL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
